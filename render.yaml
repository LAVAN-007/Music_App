# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: musicsync
    runtime: docker
    plan: free
    rootDir: MusicSync_Project
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/time
    envVars:
      # Postgres connection string from Neon (postgresql://user:password@host/db?sslmode=require).
      # Entered in the Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # Signs the login tokens. Render generates it once and keeps it across deploys.
      - key: MUSICSYNC_JWT_SECRET
        generateValue: true
