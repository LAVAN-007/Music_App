spring.application.name=music-sync-backend
# Hosting platforms pass the port to listen on as PORT
server.port=${PORT:8080}

# Accounts and sessions. Default: an H2 file next to the app (persists across restarts).
# For hosted deployments set SPRING_DATASOURCE_URL (jdbc:postgresql://...), SPRING_DATASOURCE_USERNAME
# and SPRING_DATASOURCE_PASSWORD; the driver is picked from the URL.
spring.datasource.url=jdbc:h2:file:./data/musicsync
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The song library is several thousand entries of JSON
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Song library: fetched from the remote API once, then cached on disk for 24h.
# Set remote=false to run fully offline with a few royalty-free demo tracks.
musicsync.catalog.remote=true
musicsync.catalog.cache-file=./data/catalog.json
