spring.application.name=music-sync-backend
# Hosting platforms pass the port to listen on as PORT
server.port=${PORT:8080}

# Accounts, friends and playlists. Default: an H2 file next to the app (fine on your own machine).
# On a host that wipes its disk (Render free plan), set DATABASE_URL to a Postgres connection string
# (postgresql://user:password@host/db?sslmode=require); locally it can also sit in a .env file.
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD still work and take priority.
spring.datasource.url=${MUSICSYNC_DB_URL:jdbc:h2:file:./data/musicsync}
spring.datasource.username=${MUSICSYNC_DB_USERNAME:sa}
spring.datasource.password=${MUSICSYNC_DB_PASSWORD:}
# A free hosted database allows few connections and drops idle ones.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The song library is several thousand entries of JSON
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# Song library: fetched from the remote API once, then cached on disk for 24h.
# Set remote=false to run fully offline with a few royalty-free demo tracks.
musicsync.catalog.remote=true
musicsync.catalog.cache-file=./data/catalog.json

# Signs login tokens (JWT). Set MUSICSYNC_JWT_SECRET to a long random value when hosting.
# Left empty, a new secret is made on every start and clients transparently refresh their tokens.
musicsync.jwt.secret=${MUSICSYNC_JWT_SECRET:}
